<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Server Error | CatOS
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/error.css') }}"
    >

</head>


<body>

    <main class="error-page">

        <div class="error-content">

            <p class="error-code">
                500
            </p>

            <h1>
                Something went wrong
            </h1>

            <p class="error-message">
                CatOS encountered an unexpected error.
                Please try again.
            </p>

            <button
                type="button"
                class="error-back-button"
                onclick="history.back()"
            >
                Go back
            </button>

        </div>

    </main>

</body>

</html>
